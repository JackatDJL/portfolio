        text: 'Ich entwickle Software, organisiere Projekte und arbeite gern dort, wo Technik mit echten Aufgaben zusammenkommt. Besonders beschäftige ich mich mit Webentwicklung, Open Source, Datenschutz und digitalen Werkzeugen. Neben eigenen Softwareprojekten engagiere ich mich in Robotik, politischer Bildung und Kommunikation. Dabei übernehme ich sowohl technische Arbeit als auch Organisation und Verantwortung im Team.'
