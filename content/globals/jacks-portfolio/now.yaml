        type: text
        text: 'Zurzeit arbeite ich vor allem am Erstwählerforum Stade und an AtheBlues. Mit dem Team des Erstwählerforums plane ich die nächste Ausgabe für 2027. Bei Volt Stade verantworte ich Pressearbeit, soziale Medien, Website und öffentliche Kommunikation. Außerdem singe ich als Bass im Jugendchor Neukloster und seit September 2026 zusätzlich im Klangwerk.'
