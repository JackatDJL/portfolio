llms_full: |-
  # Jack Ruder

  Jack Ruder ist Schüler und Entwickler aus Stade, Niedersachsen. Er arbeitet an Softwareprojekten, Robotik, Open Source und politischer Bildung. Diese Website ist sein persönliches Portfolio und Arbeitsarchiv.

  ## Ausgewählte Themen und Projekte

  ### Erstwählerforum Stade

  Das Erstwählerforum Stade war ein schulübergreifendes Projekt politischer Bildung für junge Menschen, besonders für Erstwählende. Jack Ruder hat es gegründet und an Organisation, Kommunikation und öffentlich sichtbarer Technik mitgearbeitet. Das Forum brachte Schülerinnen und Schüler verschiedener Schulen in Stade mit politischen Akteurinnen und Akteuren zusammen.

  [Projektseite: Erstwählerforum Stade](/projekte/erstwaehlerforum-stade)

