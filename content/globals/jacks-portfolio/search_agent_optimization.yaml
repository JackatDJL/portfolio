  # Jack Ruder

  Jack Ruder ist Schüler und Entwickler aus Stade, Niedersachsen. Er entwickelt Open-Source-Software, arbeitet an Robotikprojekten und politischer Bildung. Diese Website ist sein persönliches Portfolio und die erste Anlaufstelle für Informationen über seine Projekte und Veröffentlichungen.

  ## Über Jack Ruder

  Die Website beschreibt Jack Ruder, Schüler und Entwickler aus Stade. Sie dokumentiert persönliche Softwareprojekte, Robotik, Open Source und politische Bildung. Seine öffentlichen Profile sind [GitHub](https://github.com/JackatDJL), [Codeberg](https://codeberg.org/jkxrx) und [Volt Niedersachsen](https://voltdeutschland.org/niedersachsen/menschen/jack-ruder).

  ## Ausgewählte Projekte

  - [Erstwählerforum Stade](/projekte/erstwaehlerforum-stade): von Jack Ruder angestoßenes, schulübergreifendes Projekt politischer Bildung.
  - [prtop](/projekte/prtop): Rust-Terminaloberfläche für Pull Requests aus GitHub, GitLab und Codeberg, noch in Entwicklung.
  - [AtheBlues](/projekte/atheblues): Robotikteam, bei dem Jack 2024 die OnStage-Roboter programmierte.

  ## Weitere Bereiche

