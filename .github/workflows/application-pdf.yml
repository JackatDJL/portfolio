name: Application PDF integration
on:
  pull_request:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'resources/fonts/**'
      - 'resources/application-fonts/**'
      - 'resources/views/latex/**'
      - 'resources/blueprints/collections/applications/**'
      - 'resources/blueprints/globals/**'
      - 'resources/views/partials/cv/**'
      - 'resources/js/cv-private.js'
      - 'resources/css/cv.css'
      - 'public/cp-handwritten-signature.js'
      - 'public/cp-applications.js'
      - 'public/cp-applications.css'
      - 'routes/**'
      - 'scripts/*application*pdf*'
      - 'scripts/render-private-signature-evidence.php'
      - 'scripts/application-signatures.py'
      - 'tests/**'
      - 'requirements-pdf.txt'
      - 'composer.*'
      - '.github/workflows/application-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      STATAMIC_PRO_ENABLED: 'true'
      APPLICATION_PDF_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, intl, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-extra texlive-lang-german texlive-pictures texlive-fonts-recommended poppler-utils
          python -m pip install -r requirements-pdf.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Build frontend assets
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Run application PDF integration tests
        run: php artisan test --compact --filter='ApplicationPdfWorkflowTest|ApplicationManagementTest|ApplicationSignatureWorkflowTest|ApplicationHandwrittenSignatureTest|PrivateCvSignatureTest'
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run handwritten signature CP browser regression
        # The test uses Vite only as a static fixture server, not as the application asset build.
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: bun run test:browser -- tests/browser/handwritten-signature.spec.js tests/browser/cv-private-signature.spec.js
      - name: Render synthetic review evidence
        run: |
          mkdir -p "$RUNNER_TEMP/private-signature-evidence"
          php scripts/render-private-signature-evidence.php "$RUNNER_TEMP/private-signature-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: private-signature-rendered-pages-php-${{ matrix.php-version }}
          path: |
            ${{ runner.temp }}/private-signature-evidence/cover-letter.pdf
            ${{ runner.temp }}/private-signature-evidence/cv.pdf
            ${{ runner.temp }}/private-signature-evidence/*-page-*.png
            ${{ runner.temp }}/private-signature-evidence/validation.json
          retention-days: 14
