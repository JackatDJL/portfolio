server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    disable_symlinks on;
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_HOST $host;
        fastcgi_read_timeout 120s;
    }

    # Vite's PDF.js worker is an ES module. Nginx's default mime.types on the
    # production image does not map .mjs, so serve these hashed assets as JS.
    location ~ ^/build/assets/[^/]+\.mjs$ {
        limit_except GET HEAD {
            deny all;
        }
        default_type application/javascript;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Statamic publishes its public, content-hashed Control Panel bundle here.
    # Keep the rest of /vendor blocked below and serve only these static files.
    location ~* ^/vendor/statamic/cp/build/assets/.*\.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* ^/(?:\.env|\.git|storage|vendor)(?:/|$) {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
