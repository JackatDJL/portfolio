title: 'Seiten Inhalt'
sections:
  -
    display: Inhalt
    fields:
      -
        handle: content
        field:
          buttons:
            - h2
            - h3
            - bold
            - italic
            - unorderedlist
            - orderedlist
            - removeformat
            - quote
            - anchor
            - image
            - table
            - underline
            - strikethrough
            - code
            - codeblock
            - horizontalrule
          smart_typography: true
          reading_time: true
          word_count: true
          link_collections:
            - posts
            - projects
            - publications
            - pages
          select_across_sites: true
          container: assets
          remove_empty_nodes: false
          type: bard
          display: Inhalt
          sets:
            default:
              display: Standart
              icon: add-entry
              sets:
                callout:
                  display: Hinweis
                  icon: alert-diamond
                  fields:
                    -
                      handle: variant
                      field:
                        type: select
                        display: Art
                        default: note
                        options:
                          note: Notiz
                          info: Information
                          warning: Achtung
                          success: Erfolg
                          danger: Wichtig
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                    -
                      handle: content
                      field:
                        type: textarea
                        display: Inhalt
                        validate:
                          - required
                figure:
                  display: Abbildung
                  icon: media-image-picture-orientation
                  fields:
                    -
                      handle: image
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: Bild
                        validate:
                          - required
                    -
                      handle: alt
                      field:
                        type: text
                        display: Alternativtext
                        instructions: Beschreibt das Bild für Menschen, die es nicht sehen können.
                        validate:
                          - required
                    -
                      handle: caption
                      field:
                        type: textarea
                        display: Bildunterschrift
                    -
                      handle: credit
                      field:
                        type: text
                        display: Quelle oder Urheber
                    -
                      handle: width_mode
                      field:
                        type: select
                        display: Breite
                        default: reading
                        options:
                          reading: Lesespalte
                          wide: Breit
                          full: Ganze Inhaltsbreite
                quote:
                  display: Zitat
                  icon: text-quote
                  fields:
                    -
                      handle: quote
                      field:
                        type: textarea
                        display: Zitat
                        validate:
                          - required
                    -
                      handle: attribution
                      field:
                        type: text
                        display: Urheber oder Quelle
                wide_content:
                  display: Breiter Inhalt
                  icon: layout-three-columns
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                    -
                      handle: content
                      field:
                        type: textarea
                        display: Inhalt
                        instructions: Für kurze Erläuterungen zu Diagrammen, Demos oder eingebetteten Beispielen.
                gallery:
                  display: Galerie
                  icon: media-image-picture-gallery
                  fields:
                    -
                      handle: gallery
                      field:
                        container: assets
                        folder: photos
                        type: assets
                        display: Bilder
                    -
                      handle: width_mode
                      field:
                        type: select
                        display: Breite
                        default: reading
                        options:
                          reading: Lesespalte
                          wide: Breit
                          full: Ganze Inhaltsbreite
                project_embed:
                  display: Projektansicht
                  icon: fieldtype-html
                  fields:
                    -
                      handle: project
                      field:
                        collections:
                          - projects
                        select_across_sites: true
                        max_items: 1
                        type: entries
                        display: 'Ausgewähltes Projekt'
