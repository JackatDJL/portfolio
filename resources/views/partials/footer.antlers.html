<footer class="site-footer">
    <div class="site-container site-footer__inner">
        <div class="site-footer__identity">
            {{ partial:components/wordmark classes="text-lg" }}
            <p class="text-sm text-muted">&copy; {{ current_date | format('Y') }}</p>
        </div>

        <nav class="site-footer__nav" aria-label="Footer-Navigation">
            {{ nav:footer max_depth="1" include_home="false" }}
                {{ unless url == '/' }}
                    <a href="{{ url }}"{{ if external_url }} target="_blank" rel="noreferrer"{{ /if }}>{{ title }}</a>
                {{ /unless }}
            {{ /nav:footer }}
            {{ if site:github_url }}<a href="{{ site:github_url }}" target="_blank" rel="noreferrer">GitHub ↗</a>{{ /if }}
            {{ if site:codeberg_url }}<a href="{{ site:codeberg_url }}" target="_blank" rel="noreferrer">Codeberg ↗</a>{{ /if }}
        </nav>
    </div>
</footer>
