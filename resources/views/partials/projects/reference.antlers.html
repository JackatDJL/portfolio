{{# Kompakte Projektreferenz (Sammlungskontext). #}}
<a class="card card-interactive block p-4" href="{{ url }}">
    <span class="font-display text-base font-bold tracking-tight">{{ title }}</span>
    {{ if summary }}
        <p class="mt-2 text-sm text-muted line-clamp-3">{{ summary }}</p>
    {{ /if }}
</a>
