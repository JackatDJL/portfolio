<template data-cv-milestone data-date="{{ chronology }}" data-date-end="{{ chronology_end }}">
    <article class="cv-milestone">
        <p class="cv-milestone__date">{{ date_label }}</p>
        <div class="cv-milestone__body">
            <h3>{{ title }}</h3>
            <p class="cv-milestone__meta">{{ if organisation }}{{ organisation }}{{ else }}{{ if category == "project" }}Projekt{{ elseif category == "competition" }}Wettbewerb{{ elseif category == "volunteering" }}Ehrenamt{{ elseif category == "organisation" }}Organisation{{ elseif category == "technical" }}Technik{{ elseif category == "personal" }}Persönlich{{ /if }}{{ /if }}</p>
            <p class="cv-milestone__summary">{{ summary }}</p>
            {{ if related_projects || related_experience || related_education || links }}<div class="cv-milestone__relations" aria-label="Verwandte Inhalte">{{ if related_projects }}{{ related_projects }}{{ partial:components/related-reference inline="true" }}{{ /related_projects }}{{ /if }}{{ if related_experience }}{{ related_experience }}{{ partial:components/related-reference inline="true" }}{{ /related_experience }}{{ /if }}{{ if related_education }}{{ related_education }}{{ partial:components/related-reference inline="true" }}{{ /related_education }}{{ /if }}{{ if links }}{{ links }}{{ partial:components/outlink :href="href" :label="label" classes="related-reference--text" size="sm" }}{{ /links }}{{ /if }}</div>{{ /if }}
        </div>
    </article>
</template>
