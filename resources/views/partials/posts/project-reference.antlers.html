{{# Kompakter Projektverweis im Blog-Kontext. #}}
<a class="related-reference" href="{{ url }}" data-related-reference>
    <span class="font-display text-base font-bold tracking-tight semantic-link">{{ title }}</span>
    {{ if summary }}
        <span class="mt-1 block text-sm text-muted line-clamp-3">{{ summary }}</span>
    {{ /if }}
    <span class="related-reference__footer">
        <span class="related-reference__arrow-mask" aria-hidden="true"><span class="related-reference__arrow">↗</span></span>
    </span>
</a>
