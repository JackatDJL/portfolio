{{# Canonical asset renderer. Callers must explicitly choose content or decorative semantics. #}}
{{ if mode == 'decorative' }}
    <img class="{{ image_class ?? '' }}" src="{{ partial:media/image-url :asset="asset" width='{width ?? 1280}' :image_format="image_format" :image_quality="image_quality" }}" alt="" width="{{ asset:width }}" height="{{ asset:height }}" loading="{{ loading ?? 'lazy' }}" decoding="async"{{ if asset:focus_css }} style="object-position: {{ asset:focus_css }}"{{ /if }}{{ if sizes }} sizes="{{ sizes }}" srcset="{{ partial:media/image-url :asset="asset" width='480' :image_format="image_format" :image_quality="image_quality" }} 480w, {{ partial:media/image-url :asset="asset" width='800' :image_format="image_format" :image_quality="image_quality" }} 800w, {{ partial:media/image-url :asset="asset" width='1280' :image_format="image_format" :image_quality="image_quality" }} 1280w, {{ partial:media/image-url :asset="asset" width='1920' :image_format="image_format" :image_quality="image_quality" }} 1920w"{{ /if }}>
{{ else }}
    <figure class="media-figure {{ figure_class ?? '' }}"{{ if ratio }} style="--image-ratio: {{ ratio }}"{{ /if }}>
        <img class="{{ image_class ?? '' }}" src="{{ partial:media/image-url :asset="asset" width='{width ?? 1280}' :image_format="image_format" :image_quality="image_quality" }}" alt="{{ alt_override ?? asset:alt }}" width="{{ asset:width }}" height="{{ asset:height }}" loading="{{ loading ?? 'lazy' }}" decoding="async"{{ if asset:focus_css }} style="object-position: {{ asset:focus_css }}"{{ /if }}{{ if fetchpriority }} fetchpriority="{{ fetchpriority }}"{{ /if }}{{ if sizes }} sizes="{{ sizes }}" srcset="{{ partial:media/image-url :asset="asset" width='480' :image_format="image_format" :image_quality="image_quality" }} 480w, {{ partial:media/image-url :asset="asset" width='800' :image_format="image_format" :image_quality="image_quality" }} 800w, {{ partial:media/image-url :asset="asset" width='1280' :image_format="image_format" :image_quality="image_quality" }} 1280w, {{ partial:media/image-url :asset="asset" width='1920' :image_format="image_format" :image_quality="image_quality" }} 1920w"{{ /if }}>
        {{ unless hide_attribution }}{{ partial:media/attribution :asset="asset" :caption_override="caption_override" :credit_override="credit_override" :rights_override="rights_override" }}{{ /unless }}
    </figure>
{{ /if }}
