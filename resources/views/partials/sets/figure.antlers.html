{{ if image }}
<figure class="media-figure article-breakout article-breakout--{{ width_mode ?? 'reading' }} article-motion">
    <img src="{{ glide:image width='1600' }}" alt="{{ alt ?? image:alt }}" width="{{ image:width }}" height="{{ image:height }}" loading="lazy" decoding="async">
    {{ partial:media/attribution :asset="image" :caption_override="caption" :credit_override="credit" }}
</figure>
{{ /if }}
