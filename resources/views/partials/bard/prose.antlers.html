{{# Kanonische Rich-Text-Ausgabe für Bard-Inhalte. #}}
<div class="prose-site {{ classes ?? 'reading-width' }}">
    {{ if content }}
        {{ content }}
            {{ if type == "text" }}
                {{ text }}
            {{ else }}
                {{ partial src="sets/{type}" }}
            {{ /if }}
        {{ /content }}
    {{ /if }}
</div>
