<article class="home-publication" data-home-publication>
    <a href="{{ url }}" class="home-publication__link" aria-label="{{ title }} öffnen"></a>
    <div class="home-publication__sheet"{{ if cover }} style="--document-width: {{ cover:width }}; --document-height: {{ cover:height }}"{{ /if }}>
        <span class="home-publication__folio" aria-hidden="true">{{ date format="Y" }}</span>
        {{ if cover }}<span class="home-publication__media"><img class="home-publication__preview" src="{{ glide:cover width=960 }}" srcset="{{ glide:cover width=480 }} 480w, {{ glide:cover width=960 }} 960w" sizes="(min-width: 48rem) 36vw, 82vw" alt="" width="{{ cover:width }}" height="{{ cover:height }}" loading="lazy" decoding="async"><span class="media-overlays">{{ partial:media/overlays :asset="cover" }}</span></span>{{ /if }}
        <span class="home-publication__type">{{ publication_type:label ?? publication_type }}</span>
        <strong>{{ title }}</strong>
        {{ if abstract }}<span class="home-publication__abstract">{{ abstract }}</span>{{ /if }}
        <span class="home-publication__rule" aria-hidden="true"></span>
        <span class="home-publication__imprint">{{ publisher }}{{ if doi }} · DOI {{ doi }}{{ /if }}</span>
    </div>
</article>
