{{# Wiederverwendbare Detailseiten-Struktur: Intro, Hauptspalte, Kontext-Rail. #}}
{{ if intro }}
    <div class="detail-container detail-hero">
        {{ partial src="{intro}" }}
    </div>
{{ /if }}
<div class="detail-layout detail-container">
    <div class="detail-layout__main">
        {{ slot }}
    </div>
    {{ if aside }}
        <aside class="detail-layout__rail"{{ if aside_label }} aria-label="{{ aside_label }}"{{ /if }}>
            {{ partial src="{aside}" }}
        </aside>
    {{ /if }}
</div>
