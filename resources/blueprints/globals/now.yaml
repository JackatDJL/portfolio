title: Aktuell
tabs:
  main:
    display: Inhalt
    sections:
      -
        display: Aktueller Stand
        fields:
          -
            handle: intro
            field:
              smart_typography: true
              reading_time: true
              word_count: true
              container: assets
              remove_empty_nodes: false
              type: bard
              display: Einordnung
              validate:
                - required
          -
            handle: updated_at
            field:
              timezone: Europe/Berlin
              default: now
              type: date
              display: 'Auf dem Stand vom'
              validate:
                - required
      -
        display: Aktuelles
        fields:
          -
            handle: items
            field:
              collections:
                - projects
                - publications
              max_items: 5
              type: entries
              display: Verknüpfte Einträge
  homepage:
    display: Homepage
    sections:
      -
        fields:
          - handle: homepage_summary
            field:
              type: bard
              display: Zusammenfassung
              instructions: 'Ein bis drei kurze Absätze für die Homepage.'
              buttons: [bold, italic, anchor]
              remove_empty_nodes: true
          - handle: homepage_links
            field:
              type: grid
              display: Links
              max_rows: 3
              fields:
                - handle: label
                  field:
                    type: text
                    display: Beschriftung
                    validate: [required]
                - handle: link
                  field:
                    type: link
                    display: Link
                    collections: [pages, projects, posts, publications]
                    validate: [required]
          - handle: homepage_button_label
            field:
              type: text
              display: Button-Beschriftung
          - handle: homepage_button_link
            field:
              type: link
              display: Button-Link
              collections: [pages, projects, posts, publications]
