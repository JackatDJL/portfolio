title: Lebenslauf
tabs:
  personal:
    display: Persönliche Daten
    sections:
      -
        display: Private Kontaktangaben
        instructions: 'Diese Angaben werden verschlüsselt gespeichert und nur über einen gültigen privaten CV-Link ausgeliefert.'
        fields:
          - handle: private_email
            field:
              type: protected_text
              input_type: email
              display: Private E-Mail-Adresse
              instructions: 'Private E-Mail-Adresse für Lebensläufe. Wird verschlüsselt gespeichert und nur über einen gültigen privaten CV-Link ausgeliefert.'
          - handle: phone
            field: { type: protected_text, input_type: tel, display: Telefon, width: 50 }
          - handle: street
            field: { type: protected_text, display: Straße, width: 50 }
          - handle: house_number
            field: { type: protected_text, display: Hausnummer, width: 25 }
          - handle: postal_code
            field: { type: protected_text, display: Postleitzahl, width: 25 }
          - handle: city
            field: { type: protected_text, display: Ort, width: 50 }
          - handle: country
            field: { type: protected_text, display: Land, width: 50 }
          - handle: date_of_birth
            field: { type: protected_text, input_type: date, display: Geburtsdatum, width: 50 }
          - handle: place_of_birth
            field: { type: protected_text, display: Geburtsort, width: 50 }
      -
        display: Privaten Lebenslauf testen
        instructions: 'Der Test-Link gilt 15 Minuten und nutzt dieselbe geschützte Datenfreigabe wie ein Empfänger-Link.'
        fields:
          - handle: private_test_link
            field:
              type: html
              display: Test-Link
              html: '<div data-cv-profile-access><div class="mb-4"><h3 class="font-bold mb-2">Temporärer Prüf-Link</h3><button type="button" class="btn" data-action="temporary">Erstellen</button> <button type="button" class="btn" data-copy="temporary">Kopieren</button><p class="text-sm mt-2" data-state="temporary"></p></div><div class="mb-4"><h3 class="font-bold mb-2">Dauerhafter Link</h3><button type="button" class="btn" data-action="permanent">Erstellen</button> <button type="button" class="btn" data-copy="permanent">Kopieren</button> <button type="button" class="btn-danger" data-action="revoke">Widerrufen</button><p class="text-sm mt-2" data-state="permanent"></p></div><div><h3 class="font-bold mb-2">PDF</h3><button type="button" class="btn" data-pdf="public">Öffentliches PDF</button> <button type="button" class="btn" data-pdf="private">Privates PDF prüfen</button> <button type="button" class="btn" data-pdf="copy">PDF-URL kopieren</button></div><div class="mt-4"><h3 class="font-bold mb-2">QR-Code</h3><select data-qr-source aria-label="QR-Quelle"><option value="public">Öffentlicher CV</option><option value="temporary">Temporärer privater Link</option><option value="permanent">Dauerhafter privater Link</option></select> <button type="button" class="btn" data-qr="generate">Vorschau erzeugen</button> <button type="button" class="btn" data-qr="download">SVG herunterladen</button> <button type="button" class="btn" data-qr="copy">URL kopieren</button><div class="mt-2" data-qr-preview></div><p class="text-sm mt-2" data-qr-warning hidden>Wer diesen QR-Code erhält oder fotografiert, kann auf den privaten Lebenslauf zugreifen, bis der Link abläuft oder widerrufen wird.</p></div><p class="mt-3 text-sm" role="status" aria-live="polite" data-cv-access-status></p></div>'
  cv:
    display: Lebenslauf
    sections:
      -
        display: Über mich
        instructions: 'Kurzer, lebenslaufspezifischer Text. Empfohlen sind 60 bis 120 Wörter.'
        fields:
          - handle: about
            field:
              type: bard
              display: Über mich
              buttons: [bold, italic, removeformat, anchor]
              smart_typography: true
              link_collections: [pages, projects, publications]
              select_across_sites: true
              remove_empty_nodes: true
              sets: {}
      -
        display: Kenntnisse
        instructions: 'Nur konkrete Angaben. Keine Prozentwerte oder Bewertungsbalken.'
        fields:
          - handle: knowledge
            field:
              type: grid
              display: Kenntnisse
              add_row: Bereich hinzufügen
              fields:
                - handle: category
                  field: { type: text, display: Bereich, validate: [required], width: 33 }
                - handle: items
                  field:
                    type: grid
                    display: Einträge
                    add_row: Eintrag hinzufügen
                    width: 67
                    fields:
                      - handle: label
                        field: { type: text, display: Bezeichnung, validate: [required], width: 50 }
                      - handle: context
                        field: { type: text, display: 'Niveau oder Kontext (optional)', width: 50 }
      -
        display: Soft Skills
        instructions: 'Selbst formulierte Eigenschaften mit optionalem kurzem Kontext. Keine Bewertungen oder Prozentwerte.'
        fields:
          - handle: soft_skills
            field:
              type: grid
              display: Soft Skills
              add_row: Soft Skill hinzufügen
              fields:
                - handle: label
                  field: { type: text, display: Bezeichnung, validate: [required], width: 40 }
                - handle: context
                  field: { type: text, display: 'Kurzer Kontext (optional)', width: 60 }
  defaults:
    display: Standardauswahl
    sections:
      -
        display: Inhalte für /cv
        instructions: 'Profile können Projekte und Veröffentlichungen überschreiben. Ohne eigene Auswahl gilt diese Standardauswahl.'
        fields:
          - handle: projects
            field: { type: entries, collections: [projects], display: Projekte }
          - handle: publications
            field: { type: entries, collections: [publications], display: Veröffentlichungen }
          - handle: interactive_timeline
            field: { type: toggle, display: Interaktiver Zeitstrahl, default: true }
          - handle: timeline_start_year
            field:
              type: integer
              display: Öffentlicher Start des Zeitstrahls
              instructions: 'Jahr am linken Rand der öffentlichen Zeitachse. Kein Geburtsdatum.'
              width: 33
          - handle: milestones
            field: { type: entries, collections: [cv_milestones], display: 'Interaktive Meilensteine' }
  print:
    display: Druck / PDF
    sections:
      -
        fields:
          - handle: print_place
            field: { type: text, display: Ort, width: 50 }
          - handle: print_date
            field: { type: text, display: Datum, width: 50 }
  signature:
    display: Unterschrift
    sections:
      -
        display: Unterschrift für private CVs
        instructions: 'Nur bei gültigem, nicht widerrufenem privaten CV-Link. Die Grafik bleibt kopierbar und ist keine QES.'
        fields:
          - handle: private_cv_signature_enabled
            field:
              type: toggle
              display: Handschrift in privaten CV-Ansichten und PDFs zeigen
              default: false
              instructions: 'Öffentliche CVs und öffentliche PDFs erhalten diese Bilddatei nie. Das Aktivieren macht sie für Empfänger mit gültigem privatem CV-Link sichtbar.'
          - handle: private_cv_signature_width_mm
            field:
              type: integer
              display: Breite im privaten CV-PDF (mm)
              default: 46
              min: 30
              max: 75
              if:
                private_cv_signature_enabled: true
          - handle: private_cv_signature_baseline_mm
            field:
              type: integer
              display: Grundlinien-Versatz (mm)
              default: 0
              min: -3
              max: 3
              if:
                private_cv_signature_enabled: true
          - handle: private_cv_signature_alignment
            field:
              type: select
              display: Ausrichtung im privaten CV-PDF
              options:
                left: Links
                center: Zentriert
                right: Rechts
              default: left
              if:
                private_cv_signature_enabled: true
          - handle: private_cv_signature_mode
            field:
              type: select
              display: Signatur im privaten CV
              options:
                typed: 'Name in Momo Signature'
                handwritten: 'Handschriftliche Grafik'
              default: handwritten
              if:
                private_cv_signature_enabled: true
          - handle: signature_editor_link
            field:
              type: html
              display: Handschrift bearbeiten
              html: '<p>Die private Handschrift wird unter <a href="/cp/globals/application_defaults#signature">Bewerbungsvorgaben → Handschrift</a> gezeichnet, importiert und gespeichert.</p>'
      -
        display: Öffentliche Darstellung
        instructions: 'Das Motiv wird unabhängig von der Handschrift erzeugt. Es ist nur Dekoration und verhindert weder Kopieren noch Fälschungen.'
        fields:
          - handle: signature_pattern_enabled
            field:
              type: toggle
              display: Öffentlichen Signaturblock mit Linienmuster anzeigen
              default: false
          - handle: signature_public_source
            field:
              type: select
              display: Öffentliche Signaturdarstellung
              options:
                font: 'Name in Momo Signature'
                example: 'Separate Beispielgrafik (keine echte Unterschrift)'
              default: font
              instructions: 'Die Beispielgrafik wird im Editor unten separat gespeichert. Niemals die echte Unterschrift hier hochladen. Ohne Vorlage wird die Schrift verwendet.'
          - handle: signature_pattern_color
            field:
              type: select
              display: Farbton
              options:
                blue: Blau
                teal: Petrol
                violet: Violett
              default: blue
              if:
                signature_pattern_enabled: true
          - handle: signature_pattern_density
            field:
              type: select
              display: Liniendichte
              options:
                light: Leicht
                balanced: Ausgewogen
                fine: Fein
              default: balanced
              if:
                signature_pattern_enabled: true

          - handle: public_signature_example_editor
            field:
              type: html
              display: Separate öffentliche Beispielgrafik erstellen
              sanitize: false
              html: |
                <div class="app-handwriting" data-handwritten-signature data-source="example">
                  <section class="app-handwriting-panel" aria-labelledby="handwriting-draw-title">
                    <h3 id="handwriting-draw-title">1. Zeichnen</h3>
                    <p class="app-handwriting-instructions">Schreibe mit Maus, Stift oder Finger direkt in die Fläche. Die Schaltfläche Zeichenfläche leeren entfernt nur die aktuelle Zeichnung. Eine gespeicherte Vorlage bleibt dabei erhalten.</p>
                    <div class="app-handwriting-canvas-wrap">
                      <canvas class="app-handwriting-canvas" data-handwritten-signature-canvas width="900" height="260" aria-label="Zeichenfläche für eine handschriftliche Unterschrift" tabindex="0"></canvas>
                    </div>
                    <div class="app-cp-button-row">
                      <button class="app-cp-button" type="button" data-handwritten-clear>Zeichenfläche leeren</button>
                    </div>
                  </section>

                  <section class="app-handwriting-panel" aria-labelledby="handwriting-import-title">
                    <h3 id="handwriting-import-title">Oder Bilddatei verwenden</h3>
                    <p>Wähle einen Scan einer erkennbar erfundenen Beispielsignatur. Unterstützt werden PNG, JPEG und WebP bis 10 MB. Das Bild wird privat verarbeitet und nicht in einen öffentlichen Asset-Ordner geladen.</p>
                    <div class="app-handwriting-tools">
                      <label class="app-handwriting-file">
                        <span>Bilddatei auswählen</span>
                        <input type="file" accept="image/png,image/jpeg,image/webp" data-handwritten-upload>
                      </label>
                      <label class="app-handwriting-option">
                        <input type="checkbox" data-handwritten-remove-background>
                        <span>Hellen Hintergrund beim Speichern transparent machen</span>
                      </label>
                    </div>
                  </section>

                  <section class="app-handwriting-panel" aria-labelledby="handwriting-review-title">
                    <h3 id="handwriting-review-title">2. Zuschneiden und prüfen</h3>
                    <p>Entfernt leere Ränder. Prüfe die Vorschau, bevor du die separate Beispielvorlage speicherst.</p>
                    <div class="app-cp-button-row">
                      <button class="app-cp-button" type="button" data-handwritten-crop>Zuschneiden und Vorschau aktualisieren</button>
                    </div>
                    <div class="app-handwriting-preview" data-handwritten-preview aria-live="polite">
                      <h4>Vorschau</h4>
                      <p>Noch keine Vorschau vorhanden.</p>
                    </div>
                    <p class="app-cp-status" role="status" data-handwritten-preview-status>Erstelle zuerst eine Vorschau, bevor du speicherst.</p>
                  </section>

                  <section class="app-handwriting-panel" aria-labelledby="handwriting-save-title">
                    <h3 id="handwriting-save-title">3. Öffentliche Beispielvorlage</h3>
                    <p>Speichern ersetzt die wiederverwendbare separate Beispielvorlage. Sie wird verschlüsselt unter <code>storage/app/private</code> abgelegt. Zum Entfernen wählst du Vorlage löschen.</p>
                    <div class="app-cp-button-row">
                      <button class="app-cp-button app-cp-button-primary" type="button" data-handwritten-save disabled>Öffentliche Beispielgrafik speichern</button>
                      <button class="app-cp-button app-cp-button-danger" type="button" data-handwritten-delete>Vorlage löschen</button>
                    </div>
                    <p class="app-cp-status" role="status" data-handwritten-status>Separate Beispielvorlage wird geladen …</p>
                  </section>

                  <p class="app-handwriting-note">Nur eine erkennbar erfundene Beispielgrafik speichern. Bei Auswahl der öffentlichen Beispielgrafik können alle Besucher dieses Bild sehen und kopieren. Die echte private Handschrift gehört ausschließlich in Bewerbungsvorgaben → Handschrift. Das Linienmuster ist Dekoration und kein Kopierschutz.</p>
                </div>
