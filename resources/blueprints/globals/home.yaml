title: Homepage
tabs:
  main:
    display: Inhalt
    sections:
      -
        display: Person
        fields:
          -
            handle: intro
            field:
              reading_time: true
              word_count: true
              link_noopener: true
              link_noreferrer: true
              target_blank: true
              link_collections:
                - projects
                - publications
                - posts
                - pages
              select_across_sites: true
              container: assets
              remove_empty_nodes: false
              type: bard
              display: Einleitung
              validate:
                - required
          -
            handle: personal_media
            field:
              container: assets
              folder: photos
              restrict: true
              max_files: 4
              type: assets
              display: Persönliche Bilder
              instructions: 'Ein bis vier Bilder für den Einstieg auf der Startseite.'
      -
        display: Vorgestellt
        fields:
          -
            handle: featured_projects
            field:
              collections:
                - projects
              select_across_sites: true
              max_items: 3
              type: entries
              display: 'Vorgestellte Projekte'
              width: 50
          -
            handle: featured_posts
            field:
              collections:
                - posts
              max_items: 2
              type: entries
              display: 'Vorgestellte Texte'
              width: 50
          -
            handle: featured_publications
            field:
              collections:
                - publications
              select_across_sites: true
              max_items: 2
              type: entries
              display: 'Vorgestellte Veröffentlichungen'
