title: Bewerbung
tabs:
  overview:
    display: Übersicht
    sections:
    - fields:
      - handle: title
        field:
          type: text
          display: Interne Referenz
          instructions: Nur neutrale Referenz verwenden, keine Namen oder Kontaktdaten.
          validate:
          - required
          - max:80
      - handle: application_status
        field:
          type: select
          display: Status
          options:
            draft: Entwurf
            ready: Bereit
            sent: Versendet
            interview: Gespräch
            accepted: Zusage
            rejected: Absage
            withdrawn: Zurückgezogen
          default: draft
          validate:
          - in:draft,ready,sent,interview,accepted,rejected,withdrawn
      - handle: workflow
        field:
          type: html
          display: Bewerbungsübersicht und Aktionen
          html: |
            <div class="app-cp-workflow" data-application-overview data-application-actions>
              <p class="app-cp-recommended"><strong>Empfohlener Ablauf</strong><span>Speichern → Vorschau → Export → selbst versenden</span></p>
              <section class="app-cp-card" aria-labelledby="application-overview-title">
                <div class="app-cp-section-heading">
                  <div>
                    <h3 id="application-overview-title">Bewerbung im Überblick</h3>
                    <p>Organisation, Stelle und interne Referenz.</p>
                  </div>
                </div>
                <div class="app-cp-summary" data-application-summary aria-live="polite">Bewerbungsübersicht wird geladen …</div>
                <div class="app-cp-detail-grid">
                  <section class="app-cp-detail" aria-labelledby="application-correspondence-title">
                    <h4 id="application-correspondence-title">Letzte Korrespondenz</h4>
                    <p data-application-latest>Wird geladen …</p>
                  </section>
                  <section class="app-cp-detail" aria-labelledby="application-follow-up-title">
                    <h4 id="application-follow-up-title">Nächste Wiedervorlage</h4>
                    <p data-application-follow-up>Wird geladen …</p>
                  </section>
                </div>
                <div class="app-cp-overview-tools">
                  <p>Setzt das gespeicherte Bewerbungsdatum auf heute und entfernt eine manuelle Datumsüberschreibung.</p>
                  <button type="button" class="app-cp-button" data-reset-application-date>Datum auf heute setzen</button>
                </div>
                <section class="app-cp-notes" data-application-notes-wrap hidden>
                  <h4>Private Notizen</h4>
                  <p data-application-notes></p>
                </section>
              </section>

              <section class="app-cp-card" aria-labelledby="application-preview-title">
                <div class="app-cp-section-heading">
                  <div>
                    <h3 id="application-preview-title">Vorschau</h3>
                    <p>Die Vorschau wird frisch erzeugt und bleibt unsigniert. Prüfe die gespeicherte Bewerbung; Änderungen zuerst speichern.</p>
                  </div>
                </div>
                <div class="app-cp-button-row">
                  <button type="button" class="app-cp-button app-cp-button-primary" data-application-preview>Anschreiben und Bewerbung ansehen</button>
                  <button type="button" class="app-cp-button" data-application-cv>Bewerbungs-CV als PDF prüfen</button>
                </div>
              </section>

              <section class="app-cp-card" aria-labelledby="application-export-title">
                <div class="app-cp-section-heading">
                  <div>
                    <h3 id="application-export-title">Download und Export</h3>
                    <p>Der private Download lädt die vollständige PDF in der ausgewählten Auslieferung herunter. Du versendest sie selbst.</p>
                  </div>
                </div>
                <div class="app-cp-button-row">
                  <button type="button" class="app-cp-button app-cp-button-primary" data-application-export>Vollständige Bewerbung herunterladen</button>
                </div>
              </section>

              <section class="app-cp-card" aria-labelledby="application-access-title">
                <div class="app-cp-section-heading">
                  <div>
                    <h3 id="application-access-title">Empfängerzugriff</h3>
                    <p>Ein Link öffnet die aktuelle private PDF und lässt sich später widerrufen. Er wird nicht per E-Mail verschickt. Ein Download ist dagegen eine eigenständige Datei.</p>
                  </div>
                </div>
                <div class="app-cp-access-form">
                  <label class="app-cp-field">
                    <span>Bezeichnung für den Link</span>
                    <input class="app-cp-control" type="text" maxlength="100" data-application-grant-label value="Empfänger">
                    <small>Nur für deine Verwaltung. Der Empfänger sieht diese Bezeichnung nicht.</small>
                  </label>
                  <label class="app-cp-field">
                    <span>Ablaufdatum und Uhrzeit <span class="app-cp-muted">(optional)</span></span>
                    <input class="app-cp-control" type="datetime-local" data-application-grant-expiry aria-label="Ablaufdatum und Uhrzeit für den Empfängerzugriff">
                    <small>Ohne Datum bleibt der Link aktiv, bis du ihn widerrufst.</small>
                  </label>
                </div>
                <div class="app-cp-button-row">
                  <button type="button" class="app-cp-button app-cp-button-primary" data-application-grant-create>Empfängerlink erstellen</button>
                </div>
                <div class="app-cp-grants" data-application-grants aria-live="polite"></div>
                <div class="app-cp-new-link" hidden>
                  <label class="app-cp-field" data-application-new-link-label>
                    <span>Neuer Link. Nur hier einmal sichtbar.</span>
                    <input class="app-cp-control" type="url" readonly data-application-recipient-link>
                  </label>
                  <button type="button" class="app-cp-button" hidden data-application-copy-link>Link kopieren</button>
                  <p>Bewahre diesen Link sicher auf. Wenn du ihn verlierst, kannst du einen weiteren Link erstellen.</p>
                </div>
              </section>

              <details class="app-cp-card app-cp-advanced">
                <summary>Elektronische Signaturen</summary>
                <p>Fortgeschrittene Verwaltung externer Signaturen. Die Vorschau bleibt unsigniert. Der Export verwendet die ausgewählte Auslieferung. Eine Grafik oder Testsignatur ist keine QES.</p>
                <div class="app-cp-button-row" data-application-signatures>
                  <button type="button" class="app-cp-button" data-signature-action="status">Signaturstatus laden</button>
                  <button type="button" class="app-cp-button" data-signature-action="prepare">Endgültige PDF einfrieren</button>
                  <button type="button" class="app-cp-button" data-signature-action="unsigned">Unsignierte PDF auswählen</button>
                  <div class="app-cp-signature-versions" data-signature-versions></div>
                  <p class="app-cp-status" role="status" data-signature-status></p>
                </div>
              </details>
              <p class="app-cp-status" role="status" data-application-status></p>
            </div>
          sanitize: false
  recipient:
    display: Empfänger
    sections:
    - fields:
      - handle: recipient
        field:
          type: application_private_group
          display: Empfänger
          border: false
          fields:
          - handle: organisation
            field:
              type: text
              display: Organisation
              validate:
              - required
              - max:200
          - handle: recipient
            field:
              type: text
              display: Ansprechperson
          - handle: email
            field:
              type: text
              display: E-Mail
              validate:
              - nullable
              - email
          - handle: phone
            field:
              type: text
              display: Telefon
          - handle: address
            field:
              type: textarea
              display: Anschrift
          - handle: position
            field:
              type: text
              display: Position
              validate:
              - required
              - max:200
          - handle: year
            field:
              type: integer
              display: Bewerbungsjahr
              validate:
              - nullable
              - integer
              - between:1900,2200
          - handle: location
            field:
              type: text
              display: Ort
          - handle: period_start
            field:
              type: date
              display: Zeitraum von
              format: Y-m-d
              mode: single
              time_enabled: false
          - handle: period_end
            field:
              type: date
              display: Zeitraum bis
              validate:
              - nullable
              format: Y-m-d
              mode: single
              time_enabled: false

  letter:
    display: Anschreiben
    sections:
    - fields:
      - handle: letter
        field:
          type: application_private_group
          display: Anschreiben
          border: false
          fields:
          - handle: subject
            field:
              type: text
              display: Betreff
          - handle: salutation
            field:
              type: text
              display: Anrede
          - handle: body
            field:
              type: bard
              display: Anschreiben
              buttons:
              - bold
              - italic
              - unorderedlist
              - orderedlist
              - removeformat
              - anchor
              save_html: false
              sets:
                text:
                  display: Textbausteine
                  sets:
                    component:
                      display: Wiederverwendbarer Text
                      fields:
                      - handle: component
                        field:
                          type: application_text_component
                          display: Textbaustein
                          validate:
                          - required
                          instructions: Verwaltet unter Bewerbungsvorgaben. Änderungen
                            am Baustein wirken auf alle Verwendungen.
          - handle: closing
            field:
              type: text
              display: Grußformel
              instructions: Nur „Mit freundlichen Grüßen“ eintragen. Der Name steht im Unterschriftsfeld.

  cv:
    display: Lebenslauf
    sections:
    - fields:
      - handle: cv
        field:
          type: application_private_group
          display: Lebenslauf
          border: false
          fields:
          - handle: profile
            field:
              type: entries
              display: Bestehendes CV-Profil
              collections:
              - cv_profiles
              max_items: 1
              instructions: 'Leer: Standard-CV. Das referenzierte Profil wird nie
                verändert.'
          - handle: profile_summary
            field:
              type: html
              display: Ausgewähltes Profil
              html: '<div data-application-profile-summary aria-live="polite">Profil wird geprüft …</div>'
              sanitize: false
              if:
                profile: not empty
          - handle: advanced_cv_overrides
            field:
              type: toggle
              display: Erweiterte CV-Einstellungen anzeigen
              instructions: Zeigt gespeicherte Einleitungs- und Akzent-Overrides für dieses Profil.
              default: false
              always_save: true
              if:
                profile: not empty
          - handle: introduction
            field:
              type: textarea
              display: Bewerbungsspezifische Einleitung
              instructions: 'Leer: Einleitung des Profils übernehmen.'
              always_save: true
              if_any:
                profile: empty
                advanced_cv_overrides: true
          - handle: accent_color
            field:
              type: color
              display: Bewerbungsspezifische Akzentfarbe
              always_save: true
              if_any:
                profile: empty
                advanced_cv_overrides: true
              validate:
              - nullable
              - regex:/^#[0-9a-fA-F]{6}$/
          - handle: about_source
            field:
              type: select
              display: Über mich
              default: inherit
              options:
                inherit: Übernehmen
                override: Eigene Inhalte
                hide: Ausblenden
          - handle: knowledge_source
            field:
              type: select
              display: Kenntnisse
              default: inherit
              options:
                inherit: Übernehmen
                override: Eigene Inhalte
                hide: Ausblenden
          - handle: soft_skills_source
            field:
              type: select
              display: Soft Skills
              default: inherit
              options:
                inherit: Übernehmen
                override: Eigene Inhalte
                hide: Ausblenden
          - handle: projects_source
            field:
              type: select
              display: Projekte
              default: inherit
              options:
                inherit: Übernehmen
                override: Eigene Inhalte
                hide: Ausblenden
          - handle: publications_source
            field:
              type: select
              display: Veröffentlichungen
              default: inherit
              options:
                inherit: Übernehmen
                override: Eigene Inhalte
                hide: Ausblenden
          - handle: milestones_source
            field:
              type: select
              display: Meilensteine
              default: inherit
              options:
                inherit: Übernehmen
                override: Eigene Inhalte
                hide: Ausblenden
          - handle: about
            field:
              type: bard
              display: Über mich
              buttons:
              - bold
              - italic
              - removeformat
              - anchor
              smart_typography: true
              link_collections:
              - pages
              - projects
              - publications
              select_across_sites: true
              remove_empty_nodes: true
              sets: {}
              if:
                about_source: equals override
          - handle: knowledge
            field:
              type: grid
              display: Kenntnisse
              add_row: Bereich hinzufügen
              fields:
              - handle: category
                field:
                  type: text
                  display: Bereich
                  validate:
                  - required
                  width: 33
              - handle: items
                field:
                  type: grid
                  display: Einträge
                  add_row: Eintrag hinzufügen
                  width: 67
                  fields:
                  - handle: label
                    field:
                      type: text
                      display: Bezeichnung
                      validate:
                      - required
                      width: 50
                  - handle: context
                    field:
                      type: text
                      display: Niveau oder Kontext (optional)
                      width: 50
              if:
                knowledge_source: equals override
          - handle: soft_skills
            field:
              type: grid
              display: Soft Skills
              add_row: Soft Skill hinzufügen
              fields:
              - handle: label
                field:
                  type: text
                  display: Bezeichnung
                  validate:
                  - required
                  width: 40
              - handle: context
                field:
                  type: text
                  display: Kurzer Kontext (optional)
                  width: 60
              if:
                soft_skills_source: equals override
          - handle: projects
            field:
              type: entries
              collections:
              - projects
              display: Projekte
              if:
                projects_source: equals override
          - handle: publications
            field:
              type: entries
              collections:
              - publications
              display: Veröffentlichungen
              if:
                publications_source: equals override
          - handle: milestones
            field:
              type: entries
              collections:
              - cv_milestones
              display: Interaktive Meilensteine
              instructions: Verweist auf gemeinsame Meilensteine. Einträge nicht pro
                Profil duplizieren.
              if:
                milestones_source: equals override

  documents:
    display: Anlagen
    sections:
    - fields:
      - handle: documents
        field:
          type: application_private_group
          display: Anlagen
          border: false
          fields:
          - handle: mode
            field:
              type: select
              display: Anlagenquelle
              options:
                inherit: Globale Vorgaben
                override: Eigene Auswahl
              default: inherit
              validate:
              - in:inherit,override
          - handle: items
            field:
              type: grid
              display: Dokumente in Versand-Reihenfolge
              always_save: true
              if:
                mode: override
              fields:
              - handle: label
                field:
                  type: text
                  display: Bezeichnung
                  validate:
                  - required
                  - max:200
              - handle: category
                field:
                  type: select
                  display: Art
                  options:
                    certificate: Schulzeugnis
                    internship: Praktikumsbestätigung
                    award: Wettbewerb
                    qualification: Qualifikation
                    other: Sonstiges
                  validate:
                  - in:certificate,internship,award,qualification,other
              - handle: file
                field:
                  type: assets
                  display: PDF
                  container: application_documents
                  max_files: 1
                  min_files: 1
                  validate:
                  - required
                  restrict: true
                  allow_uploads: true
              add_row: Dokument hinzufügen
              reorderable: true

  signature:
    display: Signatur
    sections:
    - fields:
      - handle: signature
        field:
          type: application_private_group
          display: Signatur für diese Bewerbung
          border: false
          fields:
          - handle: mode
            field:
              type: select
              display: Darstellung
              instructions: 'Name in Momo Signature setzt den Namen in Schreibschrift. Handschriftliche Grafik nutzt die private Vorlage aus Bewerbungsvorgaben. Beide belegen denselben Platz in Anschreiben und CV; keine Variante ist eine QES.'
              options:
                none: Keine
                typed: 'Name in Momo Signature'
                handwritten: Handschriftliche Grafik
              default: none
              validate:
              - in:none,typed,handwritten
          - handle: name
            field:
              type: text
              display: Getippter Name
              validate:
              - required_if:signature.mode,typed
              - max:200
              always_save: true
          - handle: width_mm
            field:
              type: integer
              display: Breite im PDF (mm)
              instructions: 'Die Grafik bleibt eine kopierbare visuelle Unterschrift und ist keine QES.'
              default: 46
              min: 30
              max: 75
              if:
                mode: not none
              always_save: true
          - handle: baseline_mm
            field:
              type: integer
              display: Grundlinien-Versatz (mm)
              instructions: Positiv hebt die Grafik leicht an.
              default: 0
              min: -3
              max: 3
              if:
                mode: not none
              always_save: true
          - handle: alignment
            field:
              type: select
              display: Ausrichtung
              options:
                left: Links
                center: Zentriert
                right: Rechts
              default: left
              if:
                mode: not none
              always_save: true

  tracking:
    display: Verlauf
    sections:
    - fields:
      - handle: tracking
        field:
          type: application_private_group
          display: Verlauf
          border: false
          fields:
          - handle: application_date
            field:
              type: date
              display: Bewerbungsdatum
              default: now
              format: Y-m-d
              mode: single
              time_enabled: false
          - handle: date_override
            field:
              type: date
              display: Manuelles Datum
              instructions: Hat Vorrang. Zurücksetzen setzt beide Daten auf heute.
              format: Y-m-d
              mode: single
              time_enabled: false
          - handle: notes
            field:
              type: textarea
              display: Private Notizen
          - handle: correspondence
            field:
              type: grid
              display: Korrespondenz
              fields:
              - handle: date
                field:
                  type: date
                  display: Datum
                  validate:
                  - required
                  format: Y-m-d
                  mode: single
                  time_enabled: false
              - handle: direction
                field:
                  type: select
                  display: Richtung
                  options:
                    incoming: Eingang
                    outgoing: Ausgang
                  validate:
                  - in:incoming,outgoing
              - handle: summary
                field:
                  type: textarea
                  display: Notiz
          - handle: follow_up_status
            field:
              type: select
              display: Nachfassen
              options:
                none: Nicht geplant
                planned: Geplant
                done: Erledigt
              default: none
              validate:
              - in:none,planned,done
          - handle: follow_up_date
            field:
              type: date
              display: Wiedervorlage
              format: Y-m-d
              mode: single
              time_enabled: false
