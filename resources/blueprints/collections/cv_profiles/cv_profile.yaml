title: Lebenslauf-Profil
tabs:
  main:
    display: Profil
    sections:
      -
        display: Empfänger
        instructions: 'Das Profil übernimmt die öffentliche Identität und Standardinhalte aus der Webseite und dem Lebenslauf.'
        fields:
          - handle: title
            field: { type: text, display: Titel, validate: [required] }
          - handle: recipient_name
            field: { type: text, display: Empfänger, width: 50 }
          - handle: application_year
            field: { type: integer, display: Jahr, width: 25 }
          - handle: accent_color
            field:
              type: color
              display: Akzentfarbe
              instructions: 'Wirkt nur innerhalb des CV-Dokuments. Markenfarben vor Verwendung anhand einer verlässlichen Quelle prüfen.'
              width: 25
          - handle: optional_context
            field:
              type: textarea
              display: Kurzer Kontext
              instructions: 'Optional und sachlich. Leer lassen, wenn Empfänger und Jahr ausreichen.'
      -
        display: Inhaltsquelle
        instructions: 'Wähle eigene Inhalte oder eine wiederverwendbare CV-Vorlage.'
        fields:
          - handle: source_mode
            field:
              type: select
              display: Inhaltsquelle
              default: custom
              options:
                custom: Individuell
                template_override: Vorlage + Anpassungen
                template_only: Nur Vorlage
          - handle: content_template
            field:
              type: entries
              collections: [cv_profile_templates]
              max_items: 1
              display: CV-Vorlage
              validate: [required]
              instructions: 'Wird für „Vorlage + Anpassungen“ und „Nur Vorlage“ benötigt.'
              if:
                source_mode: 'contains_any template_override,template_only'
          - handle: interactive_timeline
            field:
              type: select
              display: Interaktiver Zeitstrahl
              default: inherit
              options:
                inherit: Standard übernehmen
                show: Anzeigen
                hide: Ausblenden
      -
        display: Inhaltsbereiche
        instructions: 'Lege für jeden Bereich fest, ob er übernommen, mit Profilinhalten ersetzt oder ausgeblendet wird. Leere eigene Inhalte blenden den Bereich bewusst aus.'
        fields:
          - handle: about_source
            field: { type: select, display: Über mich, default: inherit, options: { inherit: Übernehmen, override: Eigene Inhalte, hide: Ausblenden }, if: { source_mode: 'contains_any custom,template_override' } }
          - handle: knowledge_source
            field: { type: select, display: Kenntnisse, default: inherit, options: { inherit: Übernehmen, override: Eigene Inhalte, hide: Ausblenden }, if: { source_mode: 'contains_any custom,template_override' } }
          - handle: soft_skills_source
            field: { type: select, display: Soft Skills, default: inherit, options: { inherit: Übernehmen, override: Eigene Inhalte, hide: Ausblenden }, if: { source_mode: 'contains_any custom,template_override' } }
          - handle: projects_source
            field: { type: select, display: Projekte, default: inherit, options: { inherit: Übernehmen, override: Eigene Inhalte, hide: Ausblenden }, if: { source_mode: 'contains_any custom,template_override' } }
          - handle: publications_source
            field: { type: select, display: Veröffentlichungen, default: inherit, options: { inherit: Übernehmen, override: Eigene Inhalte, hide: Ausblenden }, if: { source_mode: 'contains_any custom,template_override' } }
          - handle: milestones_source
            field: { type: select, display: Meilensteine, default: inherit, options: { inherit: Übernehmen, override: Eigene Inhalte, hide: Ausblenden }, if: { source_mode: 'contains_any custom,template_override' } }
      -
        display: Eigene Inhalte
        instructions: 'Diese Felder erscheinen nur, wenn der zugehörige Bereich auf „Eigene Inhalte“ steht.'
        fields:
          - handle: about
            field:
              type: bard
              display: Über mich
              buttons: [bold, italic, removeformat, anchor]
              smart_typography: true
              link_collections: [pages, projects, publications]
              select_across_sites: true
              remove_empty_nodes: true
              sets: {}
              if:
                source_mode: 'contains_any custom,template_override'
                about_source: 'equals override'
          - handle: knowledge
            field:
              type: grid
              display: Kenntnisse
              add_row: Bereich hinzufügen
              if:
                source_mode: 'contains_any custom,template_override'
                knowledge_source: 'equals override'
              fields:
                - handle: category
                  field: { type: text, display: Bereich, validate: [required], width: 33 }
                - handle: items
                  field:
                    type: grid
                    display: Einträge
                    add_row: Eintrag hinzufügen
                    width: 67
                    fields:
                      - handle: label
                        field: { type: text, display: Bezeichnung, validate: [required], width: 50 }
                      - handle: context
                        field: { type: text, display: 'Niveau oder Kontext (optional)', width: 50 }
          - handle: soft_skills
            field:
              type: grid
              display: Soft Skills
              add_row: Soft Skill hinzufügen
              if:
                source_mode: 'contains_any custom,template_override'
                soft_skills_source: 'equals override'
              fields:
                - handle: label
                  field: { type: text, display: Bezeichnung, validate: [required], width: 40 }
                - handle: context
                  field: { type: text, display: 'Kurzer Kontext (optional)', width: 60 }
          - handle: projects
            field:
              type: entries
              collections: [projects]
              display: Projekte
              if:
                source_mode: 'contains_any custom,template_override'
                projects_source: 'equals override'
          - handle: publications
            field:
              type: entries
              collections: [publications]
              display: Veröffentlichungen
              if:
                source_mode: 'contains_any custom,template_override'
                publications_source: 'equals override'
          - handle: milestones
            field:
              type: entries
              collections: [cv_milestones]
              display: Interaktive Meilensteine
              instructions: 'Verweist auf gemeinsame Meilensteine. Einträge nicht pro Profil duplizieren.'
              if:
                source_mode: 'contains_any custom,template_override'
                milestones_source: 'equals override'
      -
        display: Zugriffslinks
        fields:
          - handle: cv_access_links
            field:
              type: html
              sanitize: false
              html: '<div data-cv-profile-access><div class="mb-4"><h3 class="font-bold mb-2">Temporärer Prüf-Link</h3><button type="button" class="btn" data-action="temporary">Erstellen</button> <button type="button" class="btn" data-copy="temporary">Kopieren</button><p class="text-sm mt-2" data-state="temporary"></p></div><div class="mb-4"><h3 class="font-bold mb-2">Dauerhafter Link</h3><button type="button" class="btn" data-action="permanent">Erstellen</button> <button type="button" class="btn" data-copy="permanent">Kopieren</button> <button type="button" class="btn-danger" data-action="revoke">Widerrufen</button><p class="text-sm mt-2" data-state="permanent"></p></div><div><h3 class="font-bold mb-2">PDF</h3><button type="button" class="btn" data-pdf="public">Öffentliches PDF</button> <button type="button" class="btn" data-pdf="private">Privates PDF prüfen</button> <button type="button" class="btn" data-pdf="copy">PDF-URL kopieren</button></div><div class="mt-4"><h3 class="font-bold mb-2">QR-Code</h3><select data-qr-source aria-label="QR-Quelle"><option value="public">Öffentlicher CV</option><option value="temporary">Temporärer privater Link</option><option value="permanent">Dauerhafter privater Link</option></select> <button type="button" class="btn" data-qr="generate">Vorschau erzeugen</button> <button type="button" class="btn" data-qr="download">SVG herunterladen</button> <button type="button" class="btn" data-qr="copy">URL kopieren</button><div class="mt-2" data-qr-preview></div><p class="text-sm mt-2" data-qr-warning hidden>Wer diesen QR-Code erhält oder fotografiert, kann auf den privaten Lebenslauf zugreifen, bis der Link abläuft oder widerrufen wird.</p></div><p class="mt-3 text-sm" role="status" aria-live="polite" data-cv-access-status></p></div>'
