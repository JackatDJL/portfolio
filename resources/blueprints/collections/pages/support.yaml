title: Unterstützung
tabs:
  main:
    display: Inhalt
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Seitentitel
              validate:
                - required
          -
            handle: intro
            field:
              type: textarea
              display: Einleitung
          -
            handle: opening_image
            field:
              type: assets
              container: assets
              max_files: 1
              query_scopes:
                - editorial_images
              validate:
                - image
              display: 'Persönliches Einstiegsfoto'
          -
            handle: robot_brief
            field:
              type: textarea
              display: 'Kurzes Teamkapitel'
          -
            handle: robot_team_url
            field:
              type: link
              display: 'Zuständige Teamwebsite'
          -
            handle: robot_team_label
            field:
              type: text
              display: 'Link zur Teamförderung'
          -
            handle: projects_heading
            field:
              type: text
              display: 'Überschrift Projekte'
          -
            handle: support_media
            field:
              type: assets
              container: assets
              max_files: 8
              query_scopes:
                - editorial_images
              validate:
                - image
              display: 'Fotostrom der Root-Inszenierung'
          -
            handle: education_heading
            field:
              type: text
              display: 'Überschrift Bildungsprojekt'
          -
            handle: education_intro
            field:
              type: textarea
              display: 'Text Bildungsprojekt'
          -
            handle: education_project
            field:
              type: entries
              collections:
                - projects
              max_items: 1
              display: 'Öffentliches Bildungsprojekt'
          -
            handle: education_image
            field:
              type: assets
              container: assets
              max_files: 1
              query_scopes:
                - editorial_images
              validate:
                - image
              display: 'Bild Bildungsprojekt'
          -
            handle: education_caption
            field:
              type: text
              display: 'Bildunterschrift Bildungsprojekt'
          -
            handle: options_heading
            field:
              type: text
              display: 'Überschrift Unterstützung'
          -
            handle: support_options
            field:
              type: grid
              mode: stacked
              max_rows: 4
              display: Unterstützungs-Widgets
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Titel
                -
                  handle: text
                  field:
                    type: textarea
                    display: Beschreibung
                -
                  handle: label
                  field:
                    type: text
                    display: Linktext
                -
                  handle: link
                  field:
                    type: link
                    display: Ziel
          -
            handle: rosenfold_title
            field:
              type: text
              display: 'Kapitel Rosenfold'
          -
            handle: rosenfold_intro
            field:
              type: textarea
              display: 'Einleitung Rosenfold'
          -
            handle: rosenfold_need
            field:
              type: textarea
              display: 'Bedarf Rosenfold'
          -
            handle: rosenfold_screen
            field:
              type: assets
              display: 'Rosenfold Screenshot'
              container: assets
              max_files: 1
              query_scopes:
                - editorial_images
              validate:
                - image
          -
            handle: rosenfold_screen_caption
            field:
              type: text
              display: 'Bildunterschrift Screenshot'
          -
            handle: robot_cad_caption
            field:
              type: textarea
              display: 'Bildunterschrift CAD-Aufnahme'
          -
            handle: robot_cad
            field:
              type: assets
              display: 'Aktuelle CAD-Gesamtansicht'
              container: assets
              max_files: 1
              query_scopes:
                - editorial_images
              validate:
                - image
          -
            handle: robot_title
            field:
              type: text
              display: 'Kapitel Robotik'
          -
            handle: robot_team_boundary
            field:
              type: textarea
              display: 'Verwaltung der Teamunterstützung'
          -
            handle: rosenfold_owner_label
            field:
              type: text
              display: 'Projektstatus Rosenfold'
          -
            handle: robot_owner_label
            field:
              type: text
              display: 'Verwaltungskreis Robotik'
          -
            handle: contact_label
            field:
              type: text
              display: Kontaktaktion
          -
            handle: contact_title
            field:
              type: text
              display: Kontaktüberschrift
          -
            handle: contact_intro
            field:
              type: textarea
              display: Kontakttext
  search:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
