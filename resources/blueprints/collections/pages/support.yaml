              max_files: 1
              query_scopes: [editorial_images]
              validate: [image]
          - handle: rosenfold_caption
            field:
              type: text
              display: Bildunterschrift Rosenfold
          - handle: rosenfold_need
            field:
              type: textarea
              display: Bedarf Rosenfold
