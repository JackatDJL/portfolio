title: Politik
tabs:
  main:
    display: Inhalt
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Seitentitel
              validate:
                - required
          -
            handle: work_heading
            field:
              type: text
              display: 'Überschrift politische Arbeit'
          -
            handle: school_context
            field:
              type: textarea
              display: 'Schulisches Engagement'
          -
            handle: political_origin
            field:
              type: textarea
              display: 'Weg zur Mitarbeit'
          -
            handle: tech_detail
            field:
              type: textarea
              display: 'Konkrete technische Mitarbeit'
          -
            handle: political_topics
            field:
              type: grid
              mode: stacked
              display: 'Persönliche politische Themen'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Thema
                -
                  handle: text
                  field:
                    type: textarea
                    display: 'Persönliche Einordnung'
          -
            handle: intro
            field:
              type: textarea
              display: Einleitung
              validate:
                - required
          -
            handle: hero_image
            field:
              type: assets
              display: Einstiegsbild
              container: assets
              max_files: 1
          -
            handle: chapter_forum_title
            field:
              type: text
              display: 'Kapitel Erstwählerforum'
          -
            handle: forum_project
            field:
              type: entries
              display: 'Projekt Erstwählerforum'
              collections:
                - projects
              max_items: 1
          -
            handle: forum_image
            field:
              type: assets
              display: Forumfoto
              container: assets
              max_files: 1
          -
            handle: forum_caption
            field:
              type: text
              display: 'Bildunterschrift Forum'
          -
            handle: chapter_volt_title
            field:
              type: text
              display: 'Kapitel Volt'
          -
            handle: volt_experience
            field:
              type: entries
              display: 'Mitarbeit Volt Stade'
              collections:
                - experience
          -
            handle: volt_image
            field:
              type: assets
              display: 'Foto Zusammenarbeit'
              container: assets
              max_files: 1
          -
            handle: volt_caption
            field:
              type: text
              display: 'Bildunterschrift Zusammenarbeit'
          -
            handle: personal_intro
            field:
              type: textarea
              display: 'Persönliche Einleitung'
          -
            handle: personal_image
            field:
              type: assets
              display: 'Persönliches Bild'
              container: assets
              max_files: 1
          -
            handle: personal_boundary
            field:
              type: textarea
              display: 'Persönliche Abgrenzung'
          -
            handle: invitation_heading
            field:
              type: textarea
              display: Kontaktfrage
          -
            handle: invitation_label
            field:
              type: textarea
              display: Kontaktlink
          -
            handle: political_interests_title
            field:
              type: textarea
              display: 'Kapitel politische Interessen'
  search:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
