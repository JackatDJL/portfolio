title: Erfahrung
tabs:
  main:
    display: Basis
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Rolle
              validate:
                - required
          -
            handle: organisation
            field:
              type: text
              display: Organisation
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Zusammenfassung
          -
            handle: started_at
            field:
              type: date
              display: 'Begonnen am'
          -
            handle: started_at_precision
            field:
              type: select
              display: Genauigkeit des Beginns
              default: day
              options:
                day: Tag bekannt
                month: Nur Monat bekannt
          -
            handle: period_label
            field:
              type: text
              display: Abweichende Zeitangabe
              instructions: 'Für ungefähre Zeiträume oder Schuljahre. Ersetzt die Datumsanzeige, ohne ein genaues Datum zu erfinden.'
          -
            handle: ended_at
            field:
              type: date
              display: 'Beendet am'
          -
            handle: projects
            field:
              type: entries
              collections:
                - projects
              display: Projekte
          -
            handle: topics
            field:
              type: terms
              taxonomies:
                - topics
              display: Themen
          -
            handle: links
            field:
              type: grid
              display: Öffentliche Quellen und Links
              fields:
                - handle: label
                  field: { type: text, display: Bezeichnung, validate: [required] }
                - handle: href
                  field: { type: link, display: Link, validate: [required] }
          -
            import: bard_body
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
