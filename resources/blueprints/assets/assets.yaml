title: Asset
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: alt
            field:
              display: 'Alt Text'
              type: text
              instructions: 'Beschreibung des Bildes'
          -
            handle: caption
            field:
              display: Bildunterschrift
              type: textarea
              instructions: 'Optionaler sichtbarer Text unter dem Bild.'
