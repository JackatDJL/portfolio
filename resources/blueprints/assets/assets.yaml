title: Asset
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: alt
            field:
              display: 'Alt Text'
              type: text
              instructions: 'Beschreibt den sichtbaren Bildinhalt für Screenreader. Wird nicht als Bildunterschrift angezeigt.'
          -
            handle: caption
            field:
              display: Bildunterschrift
              type: textarea
              instructions: 'Optionaler sichtbarer Text unter dem Bild.'
          -
            handle: rights
            field:
              options:
                -
                  key: jack
                  value: 'Meine eigenen'
                -
                  key: cc
                  value: 'Jemandes anderen'
              type: button_group
              display: Bildrechte
              validate:
                - required
          -
            handle: cc
            field:
              type: text
              display: 'Urheber / Quelle'
              instructions: 'Kurzer Bildnachweis, etwa Foto: Name. Lizenz nur angeben, wenn sie für dieses Werk gilt.'
              validate:
                - sometimes
                - required
              if:
                rights: 'not jack'
