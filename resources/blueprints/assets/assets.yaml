title: Asset
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: alt
            field:
              display: 'Alt Text'
              type: text
              instructions: 'Beschreibt den sichtbaren Bildinhalt für Screenreader. Wird nicht als Bildunterschrift angezeigt.'
          -
            handle: ai_involvement
            field:
              display: 'KI-Beteiligung'
              type: select
              default: none
              instructions: 'Nur tatsächliche KI-Erstellung oder -Veränderung dieser Datei eintragen. Gewöhnliche Bearbeitung allein ist kein Grund, eine KI-Veränderung zu behaupten.'
              options:
                - { key: none, value: Keine }
                - { key: fully_generated, value: 'Vollständig KI-generiert' }
                - { key: partially_modified, value: 'Teilweise mit KI verändert' }
                - { key: basic_disclosure, value: 'KI-Kennzeichnung (Basis)' }
          -
            handle: ai_disclosure
            field:
              display: 'KI-Hinweis'
              type: text
              instructions: 'Optionaler, verständlicher Hinweis neben dem offiziellen EU-Symbol.'
              validate:
                - nullable
          -
            handle: ai_icon_appearance
            field:
              display: 'Darstellung des KI-Symbols'
              type: select
              default: black
              instructions: 'Wählt eine unveränderte offizielle SVG-Variante.'
              options:
                - { key: black, value: Schwarz }
                - { key: white, value: Weiß }
                - { key: black-50, value: 'Schwarz, 50 % Deckkraft' }
                - { key: white-50, value: 'Weiß, 50 % Deckkraft' }
          -
            handle: caption
            field:
              display: Bildunterschrift
              type: textarea
              instructions: 'Optionaler sichtbarer Text unter dem Bild.'
          -
            handle: rights
            field:
              options:
                -
                  key: jack
                  value: 'Meine eigenen'
                -
                  key: cc
                  value: 'Jemandes anderen'
              type: button_group
              display: Bildrechte
              validate:
                - required
          -
            handle: cc
            field:
              type: text
              display: 'Urheber / Quelle'
              instructions: 'Kurzer Bildnachweis, etwa Foto: Name. Lizenz nur angeben, wenn sie für dieses Werk gilt.'
              validate:
                - sometimes
                - required
              if:
                rights: 'not jack'
